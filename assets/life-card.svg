<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Hopeful person on Earth</title>
  <desc id="desc">A warm editorial illustration of a person standing on a small Earth under the sun.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#75a9c5"/>
      <stop offset="0.56" stop-color="#d6ede2"/>
      <stop offset="1" stop-color="#f7dcc6"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#78b9a4"/>
      <stop offset="0.72" stop-color="#315d6d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#18201e" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="900" height="1100" fill="url(#sky)"/>
  <circle cx="720" cy="155" r="78" fill="#f2c36b"/>
